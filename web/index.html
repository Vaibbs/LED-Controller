<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Dashboard</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="dashboard">

    <!-- Top Status Bar -->
    <header class="status-bar">
        <div class="status-left">
            <span class="material-icons-round">wifi</span>
            <span>CONNECTED</span>
        </div>

        <div class="status-right">
            <span>85%</span>
            <div class="battery-container">
              <div class="percentage-bar"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <section class="content">

      <!-- Brightness Slider -->
<!-- Brightness Slider -->

<div class="brigtness-container" id="brightnessContainer">

  <!-- CENTER ICON -->

  <!-- FILL -->
  <div class="brigtness-fill" id="brightnessFill">
    <span class="brigtness-percent" id="brightnessPercent">65%</span>
  </div>

</div>
<span class="brigtness-icon" style="margin-bottom: 5%; font-size: 25px;">&#9728;</span>

<!-- Toast Message -->
<div id="toast" class="toast">Brightness: 65%</div>



        <!-- Controls -->
        <div class="controls">

            <!-- Mode Switch -->
            <div class="card">
                <label class="switch">
                  <input type="checkbox" id="modeToggle">
                  <span class="slider"></span>
                </label>
                <p>MODE</p>
            </div>
            <!-- Toast -->
            <!-- Auto Button -->
            <button class="card button">
                <span class="material-icons-round">hdr_auto</span>
                <p>AUTO</p>
            </button>

            
            
                
            
        
        </div>
        <!-- Timer -->
            
        <div class="timer-card">
          <div class="timer-left">
            <h4>TIMER</h4>
            <p class="time">
              <span id="timerScreen">00:00:00</span>
            </p>
          </div>
        
          <div class="timer-buttons">
            <button id="setBtn">SET</button>
            <button id="playPauseBtn">▶</button>
          </div>
        </div>
        
        <!-- Toast -->
        <div id="toast" class="toast">Timer Finished</div>
        <!-- Bottom Buttons -->
        <div class="bottom-buttons">
            <button class="power-btn">
                <span class="material-icons-round">power_settings_new</span>
            </button>

            <button class="add-btn">
                <span class="material-icons-round">add</span>
            </button>
        </div>

    </section>

</main>
<div id="toast" class="toast">Mode</div>



<script src="script.js"></script>
</body>
</html>
