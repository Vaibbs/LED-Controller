<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Remote Dashboard</title>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="dashboard">

    <!-- Top Status Bar -->
    <header class="status-bar">
        <div class="status-left">
            <span class="material-icons-round">wifi</span>
            <span>CONNECTED</span>
        </div>

        <div class="status-right">
            <span>85%</span>
            <div class="battery-container">
              <div class="percentage-bar"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <section class="content">

      <!-- Brightness Slider -->
<div class="brigtness-container" id="brightnessContainer">
  <div class="brigtness-fill" id="brightnessFill">
      <span class="brigtness-percent" id="brightnessPercent">65%</span>
  </div>
</div>
<!-- Toast Message -->
<div id="toast" class="toast">Brightness: 65%</div>



        <!-- Controls -->
        <div class="controls">

            <!-- Mode Switch -->
            <div class="card">
                <label class="switch">
                  <input type="checkbox" id="modeToggle">
                  <span class="slider"></span>
                </label>
                <p>MODE</p>
            </div>
            <!-- Toast -->
        <div id="toast" class="toast">Mode</div>
            <!-- Auto Button -->
            <button class="card button">
                <span class="material-icons-round">hdr_auto</span>
                <p>AUTO</p>
            </button>

            <!-- Timer -->
            <div class="timer-card">
                <div>
                    <h4>TIMER</h4>
                    <p class="time">00:45 <span>min</span></p>
                </div>
                <span class="material-icons-round timer-icon">timer</span>
            </div>

        </div>

        <!-- Bottom Buttons -->
        <div class="bottom-buttons">
            <button class="power-btn">
                <span class="material-icons-round">power_settings_new</span>
            </button>

            <button class="add-btn">
                <span class="material-icons-round">add</span>
            </button>
        </div>

    </section>

</main>



<script src="script.js"></script>
</body>
</html>
